<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1320, initial-scale=1">
  <title>Setlist Designer iPhone Store Art</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 1320px;
      height: 2868px;
      margin: 0;
      overflow: hidden;
      background: #050605;
    }
    body {
      position: relative;
      color: #f5f5f3;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      background:
        radial-gradient(circle at 96% 13%, rgba(48, 209, 88, .18), transparent 720px),
        radial-gradient(circle at 3% 82%, rgba(48, 209, 88, .08), transparent 680px),
        #050605;
    }
    body::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
      background:
        linear-gradient(rgba(255,255,255,.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.01) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }
    .masthead {
      position: absolute;
      z-index: 3;
      top: 68px;
      left: 76px;
      right: 76px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }
    .brand {
      width: 240px;
      height: 135px;
      object-fit: contain;
      object-position: left top;
    }
    .platform {
      margin-top: 30px;
      color: #879188;
      font: 700 22px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .copy {
      position: absolute;
      z-index: 3;
      top: 248px;
      left: 74px;
      right: 74px;
      text-align: center;
    }
    .kicker {
      margin: 0 0 30px;
      color: #30d158;
      font: 800 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .2em;
      text-transform: uppercase;
    }
    h1 {
      max-width: 1190px;
      margin: 0 auto;
      font-size: 94px;
      font-weight: 760;
      letter-spacing: -.06em;
      line-height: .98;
    }
    h1 .accent { color: #30d158; }
    .subhead {
      max-width: 1080px;
      margin: 34px auto 0;
      color: #a2a5a2;
      font-size: 37px;
      letter-spacing: -.015em;
      line-height: 1.25;
    }
    .device {
      position: absolute;
      z-index: 2;
      top: 760px;
      left: 50%;
      width: 916px;
      height: 1989px;
      padding: 18px;
      transform: translateX(-50%);
      border: 5px solid #626662;
      border-radius: 132px;
      background:
        linear-gradient(145deg, #343734, #080908 28%, #1b1d1b 72%, #070807);
      box-shadow:
        0 0 0 4px #121312,
        0 42px 110px rgba(0,0,0,.72),
        0 0 120px rgba(48, 209, 88, .10);
    }
    .device::before,
    .device::after {
      position: absolute;
      left: -10px;
      width: 7px;
      border-radius: 5px 0 0 5px;
      background: #4c504c;
      content: "";
    }
    .device::before { top: 338px; height: 132px; }
    .device::after { top: 508px; height: 228px; }
    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border: 2px solid #292c29;
      border-radius: 108px;
      background: #000;
    }
    .screen img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .pill {
      position: absolute;
      z-index: 5;
      left: 50%;
      bottom: 40px;
      min-width: 430px;
      padding: 24px 34px;
      transform: translateX(-50%);
      border: 2px solid rgba(48, 209, 88, .58);
      border-radius: 15px;
      background: rgba(5, 8, 5, .92);
      box-shadow: 0 0 42px rgba(48, 209, 88, .14);
      color: #ecf7ee;
      font: 800 23px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .13em;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .pill::before {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 17px;
      border-radius: 50%;
      background: #30d158;
      box-shadow: 0 0 18px #30d158;
      content: "";
    }
  </style>
</head>
<body>
  <div class="masthead">
    <img class="brand" src="/assets/sld-wordmark.png" alt="Setlist Designer">
    <span class="platform">iPhone · iPad · Mac</span>
  </div>
  <main class="copy">
    <p class="kicker" id="kicker">Setlist builder</p>
    <h1 id="headline">Build The Set.<br><span class="accent">Keep It Clear.</span></h1>
    <p class="subhead" id="subhead">Songs, sections, notes and running order in one deliberate workflow.</p>
  </main>
  <div class="device">
    <div class="screen">
      <img id="product" src="/assets/iphone-set-builder.png" alt="">
      <div class="pill" id="pill">Set-ready in minutes</div>
    </div>
  </div>
  <script>
    const shots = {
      build: {
        kicker: "Setlist builder",
        headline: "Build The Set.<br><span class=\"accent\">Keep It Clear.</span>",
        subhead: "Songs, sections, notes and running order in one deliberate workflow.",
        image: "/assets/iphone-set-builder.png",
        pill: "Templates · copies · song pool"
      },
      assign: {
        kicker: "Guitar tech workflow",
        headline: "Plan Every Change.<br><span class=\"accent\">Miss Nothing.</span>",
        subhead: "Assign guitars, tunings, capos, packs and stand slots song by song.",
        image: "/assets/iphone-assign.png",
        pill: "Rig conflicts warned early"
      },
      show: {
        kicker: "Show Mode",
        headline: "Now. Next.<br><span class=\"accent\">Exactly What Changes.</span>",
        subhead: "Large live cues keep every musician and every rig change visible under pressure.",
        image: "/assets/iphone-show-mode.png",
        pill: "Works fully offline"
      },
      export: {
        kicker: "Rich, branded exports",
        headline: "A Crew Sheet<br><span class=\"accent\">Built To Be Used.</span>",
        subhead: "Choose the useful columns, add the artist logo and print a sharp PDF.",
        image: "/assets/iphone-export.png",
        pill: "A4 · Letter · auto landscape"
      }
    };
    const key = new URLSearchParams(location.search).get("shot") || "build";
    const shot = shots[key] || shots.build;
    document.getElementById("kicker").textContent = shot.kicker;
    document.getElementById("headline").innerHTML = shot.headline;
    document.getElementById("subhead").textContent = shot.subhead;
    document.getElementById("product").src = shot.image;
    document.getElementById("pill").textContent = shot.pill;
  </script>
</body>
</html>
