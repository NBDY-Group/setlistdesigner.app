<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1440, initial-scale=1">
  <title>Setlist Designer Mac Store Art</title>
  <style>
    :root { --green: #30d158; }
    * { box-sizing: border-box; }
    html, body { width: 1440px; height: 900px; margin: 0; overflow: hidden; }
    body {
      position: relative;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(circle at 78% 22%, rgba(48, 209, 88, .2), transparent 440px),
        radial-gradient(circle at 12% 86%, rgba(48, 209, 88, .08), transparent 390px),
        #070807;
    }
    .masthead {
      position: absolute;
      z-index: 3;
      top: 30px;
      left: 54px;
      right: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .masthead img { width: 128px; height: 72px; object-fit: contain; object-position: left; }
    .platform {
      color: #8a928b;
      font: 700 12px/1 ui-monospace, "SF Mono", monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .copy {
      position: absolute;
      z-index: 3;
      top: 100px;
      left: 90px;
      right: 90px;
      text-align: center;
    }
    .kicker {
      margin: 0 0 14px;
      color: var(--green);
      font: 700 13px/1 ui-monospace, "SF Mono", monospace;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: 58px;
      line-height: 1;
      letter-spacing: -.05em;
    }
    .subhead { max-width: 980px; margin: 13px auto 0; color: #aaa; font-size: 18px; }
    .window {
      position: absolute;
      z-index: 2;
      top: 245px;
      left: 50%;
      width: 980px;
      padding: 8px;
      border: 1px solid #626562;
      border-radius: 24px;
      background: linear-gradient(145deg, #454745, #111 20%, #222 80%, #575957);
      box-shadow: 0 44px 100px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.08);
      transform: translateX(-50%);
    }
    .screen {
      overflow: hidden;
      border-radius: 17px;
      background: #080808;
      box-shadow: 0 0 0 1px #050505;
    }
    .screen img { width: 100%; height: auto; display: block; }
    .pill {
      position: absolute;
      z-index: 4;
      left: 50%;
      bottom: 18px;
      padding: 10px 18px;
      border: 1px solid rgba(48,209,88,.55);
      border-radius: 999px;
      color: #dfffe6;
      background: rgba(4,18,8,.92);
      font: 700 12px/1 ui-monospace, "SF Mono", monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      transform: translateX(-50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="masthead">
    <img src="/assets/sld-wordmark.png" alt="Setlist Designer">
    <span class="platform">Designed for Mac</span>
  </div>
  <div class="copy">
    <p class="kicker" id="kicker"></p>
    <h1 id="headline"></h1>
    <p class="subhead" id="subhead"></p>
  </div>
  <div class="window">
    <div class="screen"><img id="screen" alt=""></div>
  </div>
  <div class="pill" id="pill"></div>
  <script>
    const frames = {
      build: {
        kicker: "Build Fast",
        headline: "From song pool to show-ready setlist.",
        subhead: "Build, reorder and refine the whole show with the space and precision of Mac.",
        image: "/assets/mac-set-builder.png",
        pill: "Pointer · Keyboard · Unlimited reusable templates"
      },
      assign: {
        kicker: "Guitar Changes",
        headline: "Every instrument change. Accounted for.",
        subhead: "See every musician, instrument and song in one deliberate assignment grid.",
        image: "/assets/mac-assign.png",
        pill: "Fill · Copy · Clear · Replace Guitar"
      },
      show: {
        kicker: "Show Mode",
        headline: "See the next change before it happens.",
        subhead: "Current rig, next action and every handoff stay visible—even offline.",
        image: "/assets/mac-show-mode.png",
        pill: "Next Action · Current Song · Full Set"
      },
      export: {
        kicker: "Rich, Branded Exports",
        headline: "A professional page, every time.",
        subhead: "Design Artist Setlists and Guitar Change Sheets beside their live print preview.",
        image: "/assets/mac-export.png",
        pill: "A4 & Letter · Custom branding · Smart pagination"
      }
    };
    const key = new URLSearchParams(location.search).get("shot") || "build";
    const frame = frames[key] || frames.build;
    document.getElementById("kicker").textContent = frame.kicker;
    document.getElementById("headline").textContent = frame.headline;
    document.getElementById("subhead").textContent = frame.subhead;
    document.getElementById("screen").src = frame.image;
    document.getElementById("screen").alt = frame.kicker;
    document.getElementById("pill").textContent = frame.pill;
  </script>
</body>
</html>
